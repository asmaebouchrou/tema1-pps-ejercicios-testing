{% extends 'base.html' %}
{% block contenido %}
<section class="tarjeta formulario">
  <h1>Iniciar sesión</h1>
  {% if request.args.get('registrado') %}<div class="aviso exito" role="status">Cuenta creada. Ya puedes iniciar sesión.</div>{% endif %}
  {% if error %}<div class="aviso error" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" value="{{ usuario|default('') }}" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Iniciar sesión</button>
  </form>
</section>
{% endblock %}
